[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-simu"
dynamic = ["version"]
description = "Desktop simulator for French renovation loans (prêt travaux, éco-PTZ, TAEG, taux d'usure, taux d'endettement)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Léo Guignard" }]
keywords = ["loan", "mortgage", "simulator", "france", "pret travaux", "eco-ptz", "taeg", "amortization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["PySide6>=6.5", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["bumpver", "build", "twine"]

[project.urls]
Homepage = "https://github.com/leoguignard/loan-simu"
Source = "https://github.com/leoguignard/loan-simu"
Issues = "https://github.com/leoguignard/loan-simu/issues"

[project.gui-scripts]
loan-simu = "loan_simu.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "loan_simu.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"']
"src/loan_simu/__init__.py" = ['__version__ = "{version}"']
